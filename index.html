<style>

  --brand-1:#8a5a35; --brand-2:#6b4226; --brand-3:#c79665;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1512; --card:#132420; --ink:#eaf3f1; --muted:#93a7a3; --line:#1f3733;

}
:root[data-theme="dark"]{ --bg:#0d1512; --card:#132420; --ink:#eaf3f1; --muted:#93a7a3; --line:#1f3733; --brand-3:#d8ae83; }
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100%;position:relative;}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:var(--bg-watermark,none);background-repeat:no-repeat;background-position:center 42%;background-size:min(720px,88vw) auto;}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 60px;position:relative;z-index:1}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header h1{font-size:20px;margin:0;color:var(--teal-d)}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:14px;border-bottom:2px solid var(--line)}
nav button{flex:0 0 auto;background:none;border:none;padding:10px 14px;font-family:inherit;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer;border-radius:10px 10px 0 0;white-space:nowrap}
nav button.active{color:var(--teal-d);background:var(--card);box-shadow:0 -2px 0 var(--teal) inset}

form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(160px,100%),1fr));gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:14px;background:var(--bg);color:var(--ink)}
button.btn{background:var(--teal);color:#fff;border:none;padding:10px 16px;border-radius:9px;font-family:inherit;font-weight:700;cursor:pointer;font-size:14px}
button.btn.secondary{background:var(--navy)}
button.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
button.btn.sm{padding:6px 10px;font-size:12px;border-radius:7px}
button.btn:active{opacity:.85}

tr.clickrow{cursor:pointer}
tr.clickrow:active{opacity:.7}

<script>
(function setBrandWatermark(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
    <circle cx="400" cy="400" r="380" fill="none" stroke="#8a5a35" stroke-width="1.5" opacity="0.09"/>
    <circle cx="400" cy="400" r="300" fill="none" stroke="#6b4226" stroke-width="2" opacity="0.10"/>
    <text x="400" y="420" font-family="Tahoma, Arial, sans-serif" font-size="80" font-weight="bold" fill="#6b4226" opacity="0.10" text-anchor="middle" transform="rotate(-20 400 400)">القياتي للملابس</text>
  </svg>`;
  const uri="url('data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)+"')";
  document.documentElement.style.setProperty('--bg-watermark', uri);
})();

let state={users:[],purchaseInvoices:[],saleInvoices:[],payments:[],returns:[],expenses:[]};
let tab='dash';
let me=null; // logged in user {id,name,role}
let draftBuy=[]; let draftSell=[]; // pending line items while building an invoice
// long tables render only a page at a time (newest first) so the DOM stays light as history grows;
// pageSize resets to 50 whenever the tab is switched
let pageSize={buy:50,sell:50,payments:50,returns:50,expenses:50};
function loadMoreBtn(key,shown,total){
  if(shown>=total) return '';
  return `<div style="text-align:center;padding-top:10px;"><button class="btn ghost sm" onclick="pageSize.${key}+=50;render()">تحميل ${Math.min(50,total-shown)} حركة أقدم (${shown} من ${total})</button></div>`;
}
const FIXED_ACCT='acct_qayati_shop_main_v2'; // one shop = one shared cloud row, independent of any user's password

// ---------- cloud sync (Supabase) — optional, configured per device, shared by the whole shop ----------
// >>> املأ القيمتين دول مرة واحدة هنا (Project URL و anon public key من Supabase) وكل الأجهزة هتتصل تلقائيًا <<<
const SB_URL='https://qsihoijfrcmyownphyex.supabase.co';
const SB_KEY='sb_publishable_z8S720LHqAZWz5VzKji8mw_eIhWTve6';
function sbUrl(){ return SB_URL||localStorage.getItem('sb_url')||''; }
function sbKey(){ return SB_KEY||localStorage.getItem('sb_key')||''; }
function sbConfigured(){ return !!(sbUrl()&&sbKey()); }
let cloudError=false; // true when cloud is configured but couldn't be reached on load
function getSbClient(){
  if(typeof supabase==='undefined') return null;
  const url=sbUrl(), key=sbKey();
  if(!url||!key) return null;
  const cacheKey=url+'|'+key;
  if(!window._sbClient||window._sbClientKey!==cacheKey){
    try{ window._sbClient=supabase.createClient(url,key); window._sbClientKey=cacheKey; }
    catch(e){ return null; }
  }
  return window._sbClient;
}
async function cloudFetchState(){
  const sb=getSbClient(); if(!sb) return {data:null,error:null};
  const {data,error}=await sb.from('shop_state').select('data').eq('id',FIXED_ACCT).maybeSingle();
  if(error) return {data:null,error};
  return {data: data?data.data:null, error:null};
}
async function cloudPushState(){
  const sb=getSbClient(); if(!sb) return;
  const {error}=await sb.from('shop_state').upsert({id:FIXED_ACCT,data:state,updated_at:new Date().toISOString()});
  if(error) console.error('cloud push error',error);
}
let _pushTimer=null;
function pushCloudDebounced(){
  if(!sbConfigured()) return;
  clearTimeout(_pushTimer);
  _pushTimer=setTimeout(()=>{ cloudPushState().catch(e=>console.error(e)); }, 800);
}

// ---------- users / login gate ----------
function normalizeState(s){
  s=s||{};
  return {
    users:Array.isArray(s.users)?s.users:[],
    purchaseInvoices:Array.isArray(s.purchaseInvoices)?s.purchaseInvoices:[],
    saleInvoices:Array.isArray(s.saleInvoices)?s.saleInvoices:[],
    payments:Array.isArray(s.payments)?s.payments:[],
    returns:Array.isArray(s.returns)?s.returns:[],
    expenses:Array.isArray(s.expenses)?s.expenses:[]
  };
}
async function initStorage(){
  try{ const raw=localStorage.getItem('shop_state'); if(raw) state=JSON.parse(raw); }catch(e){}
  state=normalizeState(state);
  cloudError=false;
  if(sbConfigured()){
    try{
      const {data,error}=await cloudFetchState();
      if(error) cloudError=true; else if(data) state=normalizeState(data);
    }catch(e){ cloudError=true; }
  }
}
function renderGate(){
  const box=document.getElementById('gateBody');
  document.getElementById('gateMsg').textContent='';
  if(cloudError){
    box.innerHTML=`<p class="small" style="color:var(--danger)">تعذر الاتصال بالسحابة. تأكد من الإنترنت وحاول تاني (مش هنسمح بإنشاء حساب جديد عشان ما نبدأش بيانات فاضية بالغلط).</p>
    <button class="btn" style="width:100%" onclick="retryCloud()">إعادة المحاولة</button>`;
    return;
  }
  if(!state.users.length){
    box.innerHTML=`
    <p class="small">أول مرة بتفتح الدفتر — اعمل حساب "مدير" أساسي (له صلاحية كاملة، وممكن يضيف بعد كده حسابات تانية بصلاحيات أقل).</p>
    <label>اسمك</label><input id="setupName" placeholder="مثلاً: محمد">
    <label style="margin-top:8px;">كلمة المرور</label><input id="setupPw" type="password">
    <br><br>
    <button class="btn" style="width:100%" onclick="createFirstAdmin()">إنشاء الحساب والدخول</button>`;
  } else {
    box.innerHTML=`
    <p class="small">اكتب كلمة مرورك الشخصية للدخول. كل واحد في المحل ليه كلمة مرور خاصة بيه، وصلاحيته (كتابة أو تقارير فقط) متحددة مسبقًا.</p>
    <input id="pwInput" type="password" placeholder="كلمة المرور">
    <br><br>
    <button id="unlockBtn" class="btn" style="width:100%" onclick="tryUnlock()">دخول</button>`;
  }
}
async function retryCloud(){ await initStorage(); renderGate(); }
async function createFirstAdmin(){
  const name=document.getElementById('setupName').value.trim();
  const pw=document.getElementById('setupPw').value;
  if(!name||!pw){ document.getElementById('gateMsg').textContent='لازم تكتب الاسم وكلمة المرور'; return; }
  if(sbConfigured()){
    try{
      const {data,error}=await cloudFetchState();
      if(error){ cloudError=true; renderGate(); return; }
      if(data&&normalizeState(data).users.length){ state=normalizeState(data); renderGate(); document.getElementById('gateMsg').textContent='المحل ليه مدير بالفعل — ادخل بكلمة مرورك.'; return; }
    }catch(e){ cloudError=true; renderGate(); return; }
  }
  const user={id:uid(),name,pw,role:'admin'};
  state.users.push(user);
  me=user;
  localStorage.setItem('shop_state', JSON.stringify(state));
  pushCloudDebounced();
  openApp();
}
async function tryUnlock(){
  const v=document.getElementById('pwInput').value;
  const msgEl=document.getElementById('gateMsg'); msgEl.textContent='';
  const btn=document.getElementById('unlockBtn');
  if(btn){ btn.disabled=true; btn.textContent='جاري الدخول...'; }
  if(sbConfigured()){
    try{ const {data}=await cloudFetchState(); if(data) state=normalizeState(data); }catch(e){}
  }
  if(btn){ btn.disabled=false; btn.textContent='دخول'; }
  const user=state.users.find(u=>u.pw===v);
  if(!user){ msgEl.textContent='كلمة مرور غلط'; return; }
  me=user;
  localStorage.setItem('shop_state', JSON.stringify(state));
  openApp();
}
function lock(){ me=null; document.getElementById('app').style.display='none'; document.getElementById('gate').style.display='flex'; renderGate(); }
function openApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoami').innerHTML=`${me.name} · <span class="roletag ${me.role==='admin'?'':'viewer'}">${me.role==='admin'?'صلاحية كاملة':'تقارير فقط'}</span>`;
  tab='dash';
  render();
}
function isAdmin(){ return !!(me&&me.role==='admin'); }

// ---------- persistence ----------
function save(){
  try{ localStorage.setItem('shop_state', JSON.stringify(state)); }catch(e){}
  pushCloudDebounced();
  render();
}
async function resetAllData(){
  if(!isAdmin()) return;
  if(!confirm('هيتم مسح كل الفواتير والدفعات نهائيًا (وحسابات المستخدمين برضو) من هذا الجهاز ومن السحابة لو متصل. متأكد؟')) return;
  const typed=prompt('اكتب كلمة "مسح" بالظبط للتأكيد النهائي:');
  if(typed!=='مسح'){ alert('اتلغت العملية، مفيش حاجة اتمسحت.'); return; }
  clearTimeout(_pushTimer);
  state={users:[],purchaseInvoices:[],saleInvoices:[],payments:[],returns:[],expenses:[]};
  _cache=null;
  me=null;
  try{ localStorage.setItem('shop_state', JSON.stringify(state)); }catch(e){}
  if(sbConfigured()){
    try{ await cloudPushState(); } // must finish BEFORE reload, or the cloud still has the old data
    catch(e){ alert('اتمسحت البيانات محليًا، لكن حصل خطأ في مسحها من السحابة — تأكد من اتصالك بالإنترنت وحاول تاني من إعدادات السحابة لو لسه شايف بيانات قديمة.'); }
  }
  location.reload();
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmt(n){ return (Math.round((n||0)*100)/100).toLocaleString('ar-EG'); }
function esc(s){ return String(s==null?'':s).replace(/'/g,"\\'"); }

// ---------- derived data (built on invoices, each invoice can hold several items) ----------
// Everything below used to re-scan the full purchases/sales/payments/returns arrays from
// scratch on every single call (itemsCatalog, avgBuyPrice, partyBalance...), and a single
// render could call partyBalance() once per supplier/customer — so cost grew with data size
// squared. _cache now does ONE pass over the raw arrays per render and every helper just
// reads from it, so a render stays a flat, fast single pass no matter how many parties/items/
// invoices accumulate over time. _cache is invalidated (set to null) at the top of every
// render() and rebuilt lazily the first time something needs it.
let _cache=null;
function buildCache(){
  const itemMap={}, buyByItem={};
  const supBought={}, supPaid={}, supReturned={};
  const cusSold={}, cusPaid={}, cusReturned={};
  const supNames=new Set(), cusNames=new Set();
  const buyLines=[], sellLines=[];
  state.purchaseInvoices.forEach(inv=>{
    supBought[inv.supplier]=(supBought[inv.supplier]||0)+inv.total;
    supNames.add(inv.supplier);
    inv.items.forEach(it=>{
      itemMap[it.name]=(itemMap[it.name]||0)+it.qty;
      const b=buyByItem[it.name]||(buyByItem[it.name]={qty:0,cost:0});
      b.qty+=it.qty; b.cost+=it.total;
      buyLines.push({...it,invId:inv.id,date:inv.date,supplier:inv.supplier});
    });
  });
  state.saleInvoices.forEach(inv=>{
    cusSold[inv.customer]=(cusSold[inv.customer]||0)+inv.total;
    cusNames.add(inv.customer);
    inv.items.forEach(it=>{
      itemMap[it.name]=(itemMap[it.name]||0)-it.qty;
      sellLines.push({...it,invId:inv.id,date:inv.date,customer:inv.customer});
    });
  });
  state.payments.forEach(p=>{
    if(p.direction==='out') supPaid[p.party]=(supPaid[p.party]||0)+p.amount;
    else cusPaid[p.party]=(cusPaid[p.party]||0)+p.amount;
  });
  state.returns.forEach(r=>{
    if(r.type==='sale'){ itemMap[r.item]=(itemMap[r.item]||0)+r.qty; cusReturned[r.party]=(cusReturned[r.party]||0)+r.total; cusNames.add(r.party); }
    else { itemMap[r.item]=(itemMap[r.item]||0)-r.qty; supReturned[r.party]=(supReturned[r.party]||0)+r.total; supNames.add(r.party); }
  });
  _cache={itemMap,buyByItem,supBought,supPaid,supReturned,cusSold,cusPaid,cusReturned,supNames,cusNames,buyLines,sellLines};
}
function cache(){ if(!_cache) buildCache(); return _cache; }
function allBuyLines(){ return cache().buyLines; }
function allSellLines(){ return cache().sellLines; }
function itemsCatalog(){ return Object.entries(cache().itemMap).map(([name,remainingQty])=>({name,remainingQty})); }
function avgBuyPrice(itemName){ const b=cache().buyByItem[itemName]; return b&&b.qty? b.cost/b.qty : 0; }
function partyBalance(name,role){
  const c=cache();
  if(role==='supplier') return (c.supBought[name]||0)-(c.supPaid[name]||0)-(c.supReturned[name]||0);
  return (c.cusSold[name]||0)-(c.cusPaid[name]||0)-(c.cusReturned[name]||0);
}
// A single name can be BOTH a supplier and a customer (someone the shop both buys from and
// sells to) — that's one business relationship, not two people, so it gets ONE merged row with
// ONE net balance (what they owe as a customer minus what the shop owes them as a supplier),
// instead of showing up twice with two separate, confusing balances.
function allParties(){
  const c=cache();
  const names=new Set([...c.supNames, ...c.cusNames]);
  return [...names].map(name=>{
    const isSup=c.supNames.has(name), isCus=c.cusNames.has(name);
    const custBal=isCus?partyBalance(name,'customer'):0;
    const supBal=isSup?partyBalance(name,'supplier'):0;
    const role= isSup&&isCus ? 'both' : (isSup?'supplier':'customer');
    return {name,role,balance:custBal-supBal}; // positive: they owe the shop overall. negative: the shop owes them overall.
  });
}
function totals(){
  const totalPurchases=state.purchaseInvoices.reduce((a,i)=>a+i.total,0) - state.returns.filter(r=>r.type==='purchase').reduce((a,r)=>a+r.total,0);
  const totalSales=state.saleInvoices.reduce((a,i)=>a+i.total,0) - state.returns.filter(r=>r.type==='sale').reduce((a,r)=>a+r.total,0);
  const salesProfit=state.saleInvoices.reduce((a,i)=>a+i.items.reduce((s,it)=>s+(it.profit||0),0),0) - state.returns.filter(r=>r.type==='sale').reduce((a,r)=>a+(r.profit||0),0);
  const totalExpenses=state.expenses.reduce((a,e)=>a+e.amount,0);
  const netProfit=salesProfit-totalExpenses;
  const parties=allParties();
  const receivable=parties.filter(p=>p.balance>0).reduce((a,p)=>a+p.balance,0); // net amount owed TO the shop, per person
  const payable=parties.filter(p=>p.balance<0).reduce((a,p)=>a-p.balance,0); // net amount the shop owes, per person
  return {totalPurchases,totalSales,salesProfit,totalExpenses,netProfit,receivable,payable};
}

// ---------- draft invoice building (add several items, then save one invoice) ----------
function addDraftLine(kind){
  if(!isAdmin()) return;
  const prefix=kind==='buy'?'buy':'sell';
  const nameEl=document.getElementById(prefix+'ItemName'), qtyEl=document.getElementById(prefix+'ItemQty'), priceEl=document.getElementById(prefix+'ItemPrice');
  const name=nameEl.value.trim(), qty=+qtyEl.value, price=+priceEl.value;
  if(!name){ alert('اكتب اسم الصنف'); return; }
  if(!(qty>0)){ alert('الكمية لازم تكون أكبر من صفر'); return; }
  if(!(price>=0)){ alert('السعر لازم يكون صفر أو أكبر'); return; }
  const line={id:uid(),name,qty,price,total:qty*price};
  if(kind==='buy') draftBuy.push(line); else draftSell.push(line);
  nameEl.value=''; qtyEl.value=''; priceEl.value=''; nameEl.focus();
  render();
}
function removeDraftLine(kind,id){
  if(kind==='buy') draftBuy=draftBuy.filter(l=>l.id!==id); else draftSell=draftSell.filter(l=>l.id!==id);
  render();
}
function draftLinesHtml(kind){
  const lines=kind==='buy'?draftBuy:draftSell;
  if(!lines.length) return '<p class="small">لسه مفيش أصناف مضافة للفاتورة دي.</p>';
  const total=lines.reduce((a,l)=>a+l.total,0);
  return `${lines.map(l=>`<div class="itemline"><span class="grow">${l.name} — ${l.qty} × ${fmt(l.price)}</span><b>${fmt(l.total)}</b><button type="button" class="btn ghost sm" onclick="removeDraftLine('${kind}','${l.id}')">حذف</button></div>`).join('')}
  <div class="itemline" style="border:none;font-weight:800;">إجمالي الفاتورة<span>${fmt(total)}</span></div>`;
}
function saveBuyInvoice(e){
  e.preventDefault(); if(!isAdmin()) return;
  const f=e.target;
  const supplier=f.supplier.value.trim(), date=f.date.value||today();
  if(!supplier){ alert('لازم تكتب اسم المورد'); return; }
  if(!draftBuy.length){ alert('لازم تضيف صنف واحد على الأقل قبل الحفظ'); return; }
  const total=draftBuy.reduce((a,l)=>a+l.total,0);
  const paid=f.fullyPaid&&f.fullyPaid.checked ? total : (+f.paid.value||0);
  if(paid<0){ alert('المدفوع لازم يكون صفر أو أكبر'); return; }
  if(paid>total){ if(!confirm(`المدفوع (${fmt(paid)}) أكبر من إجمالي الفاتورة (${fmt(total)}). متأكد؟`)) return; }
  const invId=uid();
  state.purchaseInvoices.push({id:invId,date,supplier,items:draftBuy,total});
  if(paid>0) state.payments.push({id:uid(),date,party:supplier,direction:'out',amount:paid,note:'دفعة عند الشراء',sourceId:invId});
  draftBuy=[];
  save();
}
function saveSellInvoice(e){
  e.preventDefault(); if(!isAdmin()) return;
  const f=e.target;
  const customer=f.customer.value.trim(), date=f.date.value||today();
  if(!customer){ alert('لازم تكتب اسم العميل'); return; }
  if(!draftSell.length){ alert('لازم تضيف صنف واحد على الأقل قبل الحفظ'); return; }
  const cat=itemsCatalog();
  for(const l of draftSell){
    const c=cat.find(i=>i.name===l.name); const avail=c?c.remainingQty:0;
    if(l.qty>avail){ if(!confirm(`المتاح من "${l.name}" في المخزون ${avail} بس. عايز تكمل البيع برضه؟`)) return; }
  }
  draftSell.forEach(l=>{ l.profit=(l.price-avgBuyPrice(l.name))*l.qty; });
  const total=draftSell.reduce((a,l)=>a+l.total,0);
  const paid=f.fullyPaid&&f.fullyPaid.checked ? total : (+f.paid.value||0);
  if(paid<0){ alert('المدفوع لازم يكون صفر أو أكبر'); return; }
  if(paid>total){ if(!confirm(`المدفوع (${fmt(paid)}) أكبر من إجمالي الفاتورة (${fmt(total)}). متأكد؟`)) return; }
  const invId=uid();
  state.saleInvoices.push({id:invId,date,customer,items:draftSell,total});
  if(paid>0) state.payments.push({id:uid(),date,party:customer,direction:'in',amount:paid,note:'دفعة عند البيع',sourceId:invId});
  draftSell=[];
  save();
}

function editInvoiceHeader(kind,id){
  if(!isAdmin()) return;
  const list=kind==='buy'?state.purchaseInvoices:state.saleInvoices;
  const inv=list.find(i=>i.id===id); if(!inv) return;
  const partyKey=kind==='buy'?'supplier':'customer';
  const newDate=prompt('التاريخ (YYYY-MM-DD):', inv.date); if(newDate===null) return;
  const newParty=prompt(kind==='buy'?'اسم المورد:':'اسم العميل:', inv[partyKey]); if(newParty===null) return;
  if(newDate.trim()) inv.date=newDate.trim();
  if(newParty.trim()) inv[partyKey]=newParty.trim();
  save(); openInvoice(kind,id);
}
function editInvoiceItem(kind,invId,itemId){
  if(!isAdmin()) return;
  const list=kind==='buy'?state.purchaseInvoices:state.saleInvoices;
  const inv=list.find(i=>i.id===invId); if(!inv) return;
  const it=inv.items.find(x=>x.id===itemId); if(!it) return;
  const nq=prompt('الكمية الجديدة:', it.qty); if(nq===null) return;
  const np=prompt('السعر الجديد للقطعة:', it.price); if(np===null) return;
  const qty=+nq, price=+np;
  if(!(qty>0)||!(price>=0)){ alert('قيم غير صحيحة'); return; }
  it.qty=qty; it.price=price; it.total=qty*price;
  if(kind==='sell') it.profit=(price-avgBuyPrice(it.name))*qty;
  inv.total=inv.items.reduce((a,x)=>a+x.total,0);
  save(); openInvoice(kind,invId);
}
function deleteInvoiceItem(kind,invId,itemId){
  if(!isAdmin()) return;
  if(!confirm('حذف الصنف ده من الفاتورة؟')) return;
  const list=kind==='buy'?state.purchaseInvoices:state.saleInvoices;
  const inv=list.find(i=>i.id===invId); if(!inv) return;
  inv.items=inv.items.filter(x=>x.id!==itemId);
  inv.total=inv.items.reduce((a,x)=>a+x.total,0);
  if(!inv.items.length){ deleteInvoice(kind,invId); return; }
  save(); openInvoice(kind,invId);
}
function addItemToExistingInvoice(kind,invId){
  if(!isAdmin()) return;
  const name=prompt('اسم الصنف:'); if(name===null||!name.trim()) return;
  const qty=+prompt('الكمية:'); const price=+prompt('السعر للقطعة:');
  if(!(qty>0)||!(price>=0)){ alert('قيم غير صحيحة'); return; }
  const list=kind==='buy'?state.purchaseInvoices:state.saleInvoices;
  const inv=list.find(i=>i.id===invId); if(!inv) return;
  const it={id:uid(),name:name.trim(),qty,price,total:qty*price};
  if(kind==='sell') it.profit=(price-avgBuyPrice(it.name))*qty;
  inv.items.push(it);
  inv.total=inv.items.reduce((a,x)=>a+x.total,0);
  save(); openInvoice(kind,invId);
}
function deleteInvoice(kind,id){
  if(!isAdmin()) return;
  if(!confirm('هيتم حذف الفاتورة كاملة وأي دفعة مرتبطة بيها. متأكد؟')) return;
  if(kind==='buy') state.purchaseInvoices=state.purchaseInvoices.filter(i=>i.id!==id);
  else state.saleInvoices=state.saleInvoices.filter(i=>i.id!==id);
  state.payments=state.payments.filter(p=>p.sourceId!==id);
  closeModal();
  save();
}

// ---------- returns ----------
function addReturn(e){
  e.preventDefault(); if(!isAdmin()) return;
  const f=e.target;
  const type=f.type.value;
  const qty=+f.qty.value, price=+f.price.value;
  const item=f.item.value.trim(), party=f.party.value.trim(), note=f.note.value.trim();
  if(!item||!party){ alert('لازم تكتب اسم الصنف واسم العميل/المورد'); return; }
  if(!(qty>0)){ alert('الكمية لازم تكون رقم أكبر من صفر'); return; }
  if(!(price>=0)){ alert('السعر لازم يكون صفر أو أكبر'); return; }
  if(type==='purchase'){
    const cur=itemsCatalog().find(i=>i.name===item);
    const avail=cur?cur.remainingQty:0;
    if(qty>avail){ if(!confirm(`المتاح من "${item}" في المخزون ${avail} بس. عايز تكمل برضه؟`)) return; }
  } else {
    const soldToParty=allSellLines().filter(s=>s.name===item&&s.customer===party).reduce((a,s)=>a+s.qty,0);
    const alreadyReturned=state.returns.filter(r=>r.type==='sale'&&r.item===item&&r.party===party).reduce((a,r)=>a+r.qty,0);
    const availToReturn=soldToParty-alreadyReturned;
    if(qty>availToReturn){ if(!confirm(`"${party}" اشترى منك ${soldToParty} بس من "${item}". متأكد إنك عايز تسجل مرتجع ${qty}؟`)) return; }
  }
  const total=qty*price;
  const rec={id:uid(),date:today(),type,item,qty,price,total,party,note};
  if(type==='sale') rec.profit=(price-avgBuyPrice(item))*qty;
  state.returns.push(rec);
  save();
}
function delReturn(id){
  if(!isAdmin()) return;
  if(!confirm('حذف المرتجع ده نهائيًا؟')) return;
  state.returns=state.returns.filter(r=>r.id!==id);
  save();
}

// ---------- party statement ----------
// A "both" party shows their purchase invoices, sale invoices, all payments and all returns
// together in one net timeline (see the sign comment on allParties() for why).
function openPartyStatement(name,role){
  const isSup=role==='supplier'||role==='both', isCus=role==='customer'||role==='both';
  const buyInvs=isSup?state.purchaseInvoices.filter(i=>i.supplier===name):[];
  const sellInvs=isCus?state.saleInvoices.filter(i=>i.customer===name):[];
  const pays=state.payments.filter(p=>p.party===name);
  const rets=state.returns.filter(r=>r.party===name&&((r.type==='purchase'&&isSup)||(r.type==='sale'&&isCus)));
  let rows=[
    ...buyInvs.map(i=>({date:i.date,label:'فاتورة شراء',amount:-i.total,ref:()=>openInvoice('buy',i.id)})),
    ...sellInvs.map(i=>({date:i.date,label:'فاتورة بيع',amount:i.total,ref:()=>openInvoice('sell',i.id)})),
    ...pays.map(p=>({date:p.date,label:`دفعة ${p.direction==='out'?'صادرة':'واردة'}${p.note?' — '+p.note:''}`,amount:p.direction==='out'?p.amount:-p.amount})),
    ...rets.map(r=>({date:r.date,label:`مرتجع ${r.type==='sale'?'بيع':'شراء'} (${r.item} × ${r.qty})`,amount:r.type==='sale'?-r.total:r.total}))
  ].sort((a,b)=>a.date.localeCompare(b.date));
  const totalBalance=rows.reduce((a,r)=>a+r.amount,0);
  const roleLabel=role==='both'?'عميل ومورد':(role==='supplier'?'مورد':'عميل');
  document.getElementById('modalRoot').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal lg">
    <h2>كشف حساب (${roleLabel}): ${name} <button class="btn ghost sm" onclick="closeModal()">إغلاق ✕</button></h2>
    <p class="small">الرصيد الحالي: <b>${fmt(Math.abs(totalBalance))}</b> ${totalBalance>0?'(ليك عليه)':(totalBalance<0?'(عليك له)':'(متزن)')}</p>
    ${isAdmin()?`<div style="margin-bottom:10px;"><button class="btn ghost sm" onclick="addPayment('${esc(name)}','${role}')">تسجيل دفعة جديدة</button></div>`:''}
    ${!rows.length?'<div class="emptystate">لسه مفيش حركات</div>':`<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>الحركة</th><th>القيمة</th><th>الرصيد بعدها</th></tr></thead><tbody id="stmtBody"></tbody></table></div>`}
  </div></div>`;
  if(rows.length){
    const tbody=document.getElementById('stmtBody');
    let run2=0;
    rows.forEach(r=>{
      run2+=r.amount;
      const tr=document.createElement('tr');
      if(r.ref){ tr.className='clickrow'; tr.onclick=r.ref; }
      tr.innerHTML=`<td>${r.date}</td><td>${r.label}</td><td>${fmt(r.amount)}</td><td>${fmt(run2)}</td>`;
      tbody.appendChild(tr);
    });
  }
}

function pdfSectionTitle(text){ return `<div style="font-size:15px;font-weight:800;color:${PDF_THEME.tealD};margin-bottom:14px;">${text}</div>`; }
function pdfTable(headers,rows){
  const c=PDF_THEME;
  const th=`padding:7px 6px;text-align:right;font-size:11px;color:#fff;background:${c.teal};font-weight:700;`;
  const td=`padding:6px 6px;font-size:11px;border-bottom:1px solid ${c.line};color:${c.ink};`;
  return `<table style="width:100%;border-collapse:collapse;">
    <thead><tr>${headers.map(h=>`<th style="${th}">${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(v=>`<td style="${td}">${v}</td>`).join('')}</tr>`).join('')}</tbody>
  </table>`;
}
function pdfStat(label,val,color){
  const c=PDF_THEME;
  return `<div style="flex:1;background:${c.soft};border:1px solid ${c.line};border-radius:12px;padding:14px;text-align:center;">
    <div style="font-size:11px;color:${c.muted};margin-bottom:6px;">${label}</div>
    <div style="font-size:18px;font-weight:800;color:${color||c.ink};">${fmt(val)}</div>
  </div>`;
}
async function backupPDF(){
  if(!window.jspdf||!window.html2canvas){ alert('تعذر تحميل مكتبات التصدير، تأكد من اتصالك بالإنترنت وحاول تاني.'); return; }
  const {jsPDF}=window.jspdf;
  const c=PDF_THEME;
  const t=totals();
  const ROWS_PER_PAGE=16;
  const bodies=[];
  bodies.push(`
    ${pdfSectionTitle('ملخص عام')}
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      ${pdfStat('إجمالي المشتريات',t.totalPurchases)}
      ${pdfStat('إجمالي المبيعات',t.totalSales)}
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      ${pdfStat('ربح المبيعات قبل المصروفات',t.salesProfit,c.ok)}
      ${pdfStat('إجمالي المصروفات',t.totalExpenses,c.danger)}
    </div>
    <div style="display:flex;gap:10px;margin-bottom:10px;">
      ${pdfStat('صافي الربح بعد المصروفات',t.netProfit,t.netProfit<0?c.danger:c.ok)}
      ${pdfStat('مستحق ليك (صافي عند العملاء)',t.receivable,c.ok)}
    </div>
    <div style="display:flex;gap:10px;margin-bottom:22px;">
      ${pdfStat('مستحق عليك (صافي للموردين)',t.payable,c.danger)}
      ${pdfStat('عدد الأصناف',itemsCatalog().length)}
    </div>
    <div style="font-size:12px;color:${c.muted};line-height:2;">
      عدد فواتير الشراء: ${state.purchaseInvoices.length}<br>
      عدد فواتير البيع: ${state.saleInvoices.length}<br>
      عدد المرتجعات: ${state.returns.length}<br>
      عدد الدفعات المسجلة: ${state.payments.length}<br>
      عدد بنود المصروفات: ${state.expenses.length}
    </div>`);
  function chunkRows(title,rows,headers,mapFn){
    if(!rows.length){ bodies.push(`${pdfSectionTitle(title)}<div style="text-align:center;color:${c.muted};padding:30px 0;font-size:12px;">لا توجد بيانات</div>`); return; }
    for(let i=0;i<rows.length;i+=ROWS_PER_PAGE){
      const slice=rows.slice(i,i+ROWS_PER_PAGE);
      bodies.push(`${pdfSectionTitle(`${title} (${i+1}–${Math.min(i+ROWS_PER_PAGE,rows.length)} من ${rows.length})`)}${pdfTable(headers,slice.map(mapFn))}`);
    }
  }
  chunkRows('المشتريات', allBuyLines().slice().reverse(),
    ['التاريخ','الصنف','الكمية','سعر الشراء','الإجمالي','المورد'],
    p=>[p.date,p.name,p.qty,fmt(p.price),fmt(p.total),p.supplier]);
  chunkRows('المبيعات', allSellLines().slice().reverse(),
    ['التاريخ','الصنف','الكمية','سعر البيع','الإجمالي','الربح','العميل'],
    s=>[s.date,s.name,s.qty,fmt(s.price),fmt(s.total),fmt(s.profit),s.customer]);
  chunkRows('المرتجعات', state.returns.slice().reverse(),
    ['التاريخ','النوع','الصنف','الكمية','السعر','الإجمالي','الطرف'],
    r=>[r.date,r.type==='sale'?'بيع':'شراء',r.item,r.qty,fmt(r.price),fmt(r.total),r.party]);
  chunkRows('الدفعات', state.payments.slice().reverse(),
    ['التاريخ','النوع','القيمة','الطرف','ملاحظة'],
    p=>[p.date,p.direction==='in'?'وارد':'صادر',fmt(p.amount),p.party,p.note||'']);
  chunkRows('المصروفات', state.expenses.slice().reverse(),
    ['التاريخ','البند','القيمة','ملاحظة'],
    x=>[x.date,x.category,fmt(x.amount),x.note||'']);
  if(document.fonts&&document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }
  try{
    const doc=new jsPDF('p','pt','a4');
    const total=bodies.length;
    for(let i=0;i<total;i++){
      const holder=document.createElement('div');
      holder.style.cssText='position:absolute;left:-10000px;top:0;width:794px;height:1123px;';
      holder.innerHTML=pdfPageShell(bodies[i],i+1,total);
      document.body.appendChild(holder);
      let canvas;
      try{ canvas=await html2canvas(holder.firstElementChild,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false}); }
      finally{ document.body.removeChild(holder); }
      if(i>0) doc.addPage();
      doc.addImage(canvas.toDataURL('image/png'),'PNG',0,0,595.28,841.89);
    }
    const blob=doc.output('blob');
    const filename='shop-backup-'+today()+'.pdf';
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; a.click();
    URL.revokeObjectURL(url);
  }catch(err){ alert('حصل خطأ أثناء إنشاء ملف الـ PDF، جرب تاني. (تفاصيل: '+(err&&err.message?err.message:err)+')'); }
}

// ---------- render ----------
function tabsFor(){
  const t=[['dash','لوحة التحكم'],['buy','المشتريات'],['sell','المبيعات'],['returns','المرتجعات'],['ledger','العملاء والموردين'],['payments','الدفعات'],['expenses','المصروفات']];
  if(isAdmin()) t.push(['users','المستخدمين']);
  t.push(['backup','النسخ الاحتياطي']);
  return t;
}
function render(){
  _cache=null; // state may have changed since the last render — rebuild derived data once, lazily
  const TABS=tabsFor();
  const nav=document.getElementById('tabs');
  nav.innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="setTab('${k}')">${l}</button>`).join('');
  const c=document.getElementById('content');
  if(tab==='dash') c.innerHTML=renderDash();
  else if(tab==='buy') c.innerHTML=renderBuy();
  else if(tab==='sell') c.innerHTML=renderSell();
  else if(tab==='returns') c.innerHTML=renderReturns();
  else if(tab==='ledger') c.innerHTML=renderLedger();
  else if(tab==='payments') c.innerHTML=renderPayments();
  else if(tab==='expenses') c.innerHTML=renderExpenses();
  else if(tab==='users'&&isAdmin()) c.innerHTML=renderUsers();
  else if(tab==='backup') c.innerHTML=renderBackup();
  attachForms();
}
function setTab(k){ tab=k; draftBuy=[]; draftSell=[]; pageSize={buy:50,sell:50,payments:50,returns:50,expenses:50}; render(); }
function attachForms(){

}

  if(!state.payments.length) return '<div class="emptystate">لسه مفيش دفعات</div>';
  const all=state.payments.slice().reverse(), rows=all.slice(0,pageSize.payments);
  return `<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>القيمة</th><th>الطرف</th><th>ملاحظة</th>${isAdmin()?'<th></th>':''}</tr></thead><tbody>
  ${rows.map(p=>`<tr><td>${p.date}</td><td>${p.direction==='in'?'وارد':'صادر'}</td><td>${fmt(p.amount)}</td><td>${p.party}</td><td class="small">${p.note||''}</td>${isAdmin()?`<td style="white-space:nowrap;"><button class="btn ghost sm" onclick="editPayment('${p.id}')">تعديل</button> <button class="btn ghost sm" onclick="deletePayment('${p.id}')">حذف</button></td>`:''}</tr>`).join('')}
  </tbody></table></div>${loadMoreBtn('payments',rows.length,all.length)}`;
}
function renderExpenses(){
  const t=totals();
  return `<div class="card"><h2>المصروفات</h2>
  <p class="small">أي مصروف بتسجله هنا بيتخصم من صافي الربح في لوحة التحكم.</p>
  ${isAdmin()?`<form id="expenseForm">
    <div><label>البند (كهرباء، إيجار، مواصلات...)</label><input name="category" list="expCatDL" required></div>
    <div><label>القيمة</label><input name="amount" type="number" step="any" required></div>
    <div><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div>
    <div><label>ملاحظة (اختياري)</label><input name="note"></div>
    <div><button class="btn" type="submit">حفظ المصروف</button></div>
  </form>
  <datalist id="expCatDL">${[...new Set(state.expenses.map(e=>e.category))].map(c=>`<option value="${c}">`).join('')}</datalist>`:''}
  <p class="small" style="margin-top:6px;">إجمالي المصروفات: <b>${fmt(t.totalExpenses)}</b></p>
  ${expensesTable()}
  </div>`;
}
function expensesTable(){
  if(!state.expenses.length) return '<div class="emptystate">لسه مفيش مصروفات</div>';
  const all=state.expenses.slice().reverse(), rows=all.slice(0,pageSize.expenses);
  return `<div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>البند</th><th>القيمة</th><th>ملاحظة</th>${isAdmin()?'<th></th>':''}</tr></thead><tbody>
  ${rows.map(x=>`<tr><td>${x.date}</td><td>${x.category}</td><td>${fmt(x.amount)}</td><td class="small">${x.note||''}</td>${isAdmin()?`<td style="white-space:nowrap;"><button class="btn ghost sm" onclick="editExpense('${x.id}')">تعديل</button> <button class="btn ghost sm" onclick="deleteExpense('${x.id}')">حذف</button></td>`:''}</tr>`).join('')}
  </tbody></table></div>${loadMoreBtn('expenses',rows.length,all.length)}`;
}
function renderUsers(){
  return `<div class="card"><h2>المستخدمين</h2>
  <p class="small">صاحب صلاحية "كاملة" يقدر يسجل ويعدل ويحذف. صاحب صلاحية "تقارير فقط" يقدر يشوف كل حاجة بس مايعدلش.</p>
  <form id="userForm">
    <div><label>الاسم</label><input name="name" required></div>
    <div><label>كلمة المرور</label><input name="pw" required></div>
    <div><label>الصلاحية</label><select name="role"><option value="viewer">تقارير فقط</option><option value="admin">كاملة</option></select></div>
    <div><button class="btn" type="submit">إضافة مستخدم</button></div>
  </form>
  <div class="tablewrap"><table><thead><tr><th>الاسم</th><th>الصلاحية</th><th></th></tr></thead><tbody>
  ${state.users.map(u=>`<tr><td>${u.name}${me&&me.id===u.id?' (أنت)':''}</td><td><span class="roletag ${u.role==='admin'?'':'viewer'}">${u.role==='admin'?'كاملة':'تقارير فقط'}</span></td><td><button class="btn ghost sm" onclick="deleteUser('${u.id}')">حذف</button></td></tr>`).join('')}
  </tbody></table></div>
  </div>`;
}
function renderBackup(){
  return `<div class="card"><h2>النسخ الاحتياطي</h2>
  <p class="small">قبل أي تعديل مهم أو كل شوية، اضغط الزرار ده عشان تاخد نسخة PDF بكل بياناتك.</p>
  <button class="btn secondary" onclick="backupPDF()">⬇️ تنزيل نسخة PDF الآن</button>
  </div>
  ${isAdmin()?`<div class="card"><h2>مسح كل البيانات</h2>
  <p class="small">دي عملية نهائية مفيش رجوع فيها — خد نسخة PDF الأول لو مش متأكد.</p>
  <button class="btn ghost" style="color:var(--danger);border-color:var(--danger)" onclick="resetAllData()">🗑️ مسح كل البيانات نهائيًا</button>
  </div>`:''}`;
}

// ---------- boot ----------
(async function(){
  await initStorage();
  renderGate();
  document.getElementById('gate').style.display='flex';
})();
</script>
</body>
</html>
